<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title>Cute cat coding: Learn. Build. Improve.</title>
<style>
.f{animation:fl 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-10px) rotate(6deg)}}
.tw{animation:tw 3s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.eye{transform-box:fill-box;transform-origin:center;animation:bl 4.5s infinite}
@keyframes bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.ear{transform-box:fill-box;transform-origin:bottom center;animation:ear 5s infinite}
@keyframes ear{0%,88%,100%{transform:rotate(0)}92%{transform:rotate(-8deg)}96%{transform:rotate(3deg)}}
.paw{animation:tap .6s infinite ease-in-out}
@keyframes tap{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.ln{transform-box:fill-box;transform-origin:left center;animation:ty 6s infinite cubic-bezier(.34,1.56,.64,1)}
@keyframes ty{0%{transform:scaleX(0)}20%,80%{transform:scaleX(1)}90%,100%{transform:scaleX(0)}}
.cur{animation:cu 1s steps(1) infinite}
@keyframes cu{50%{opacity:0}}
.hr{opacity:0;transform-box:fill-box;transform-origin:center;animation:hr 3.5s infinite ease-out}
@keyframes hr{0%{opacity:0;transform:translateY(10px) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translateY(-45px) scale(1.2)}}
.w{opacity:0;animation:w 6s infinite cubic-bezier(.34,1.56,.64,1)}
@keyframes w{0%{opacity:0;transform:translateY(18px)}6%,30%{opacity:1;transform:translateY(0)}36%{opacity:0;transform:translateY(-18px)}100%{opacity:0}}
.bar{transform-box:fill-box;transform-origin:left center;animation:bar 2s infinite linear}
@keyframes bar{0%{transform:scaleX(0)}90%,100%{transform:scaleX(1)}}
.dot{opacity:.3;transform-box:fill-box;transform-origin:center;animation:dt 6s infinite}
@keyframes dt{0%,30%{opacity:1;transform:scale(1.5)}36%,100%{opacity:.3;transform:scale(1)}}
</style>
<defs>
<clipPath id="fr"><rect x="8" y="8" width="784" height="284" rx="18"/></clipPath>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050A1A"/><stop offset="1" stop-color="#0B1B40"/></linearGradient>
<filter id="bl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<g clip-path="url(#fr)">
<rect width="800" height="300" fill="url(#bg)"/>
<g stroke="#7DD3FC" stroke-width="2">
<path class="tw" d="M60 50h8M64 46v8"/><path class="tw" style="animation-delay:.6s" d="M400 40h8M404 36v8"/>
<path class="tw" style="animation-delay:1.2s" d="M760 70h8M764 66v8"/><path class="tw" style="animation-delay:1.8s" d="M740 255h8M744 251v8"/>
<path class="tw" style="animation-delay:2.2s" d="M410 270h8M414 266v8"/>
</g>

<!-- cat + laptop -->
<rect x="135" y="160" width="190" height="115" rx="16" fill="#38BDF8" opacity=".22" filter="url(#bl)"/>
<g class="ear"><path d="M190 128L192 84L225 112Z" fill="#E0F2FE"/><path d="M198 118L199 98L214 112Z" fill="#7DD3FC"/></g>
<g class="ear" style="animation-delay:.3s"><path d="M270 128L268 84L235 112Z" fill="#E0F2FE"/><path d="M262 118L261 98L246 112Z" fill="#7DD3FC"/></g>
<ellipse cx="230" cy="150" rx="50" ry="40" fill="#E0F2FE"/>
<g class="eye"><ellipse cx="211" cy="146" rx="5.5" ry="6.5" fill="#0B1736"/><circle cx="213" cy="143.5" r="2" fill="#fff"/></g>
<g class="eye"><ellipse cx="249" cy="146" rx="5.5" ry="6.5" fill="#0B1736"/><circle cx="251" cy="143.5" r="2" fill="#fff"/></g>
<ellipse cx="199" cy="156" rx="7" ry="4" fill="#F9A8D4" opacity=".85"/><ellipse cx="261" cy="156" rx="7" ry="4" fill="#F9A8D4" opacity=".85"/>
<ellipse cx="230" cy="153" rx="3" ry="2" fill="#F472B6"/>
<path d="M224 157q3 4 6 0q3 4 6 0" stroke="#0B1736" stroke-width="1.5" fill="none" stroke-linecap="round"/>
<g stroke="#93C5FD" stroke-width="1.5" stroke-linecap="round"><path d="M186 152l-18-4M186 158l-17 2M274 152l18-4M274 158l17 2"/></g>
<rect x="140" y="165" width="180" height="100" rx="10" fill="#0B1736" stroke="#38BDF8" stroke-width="2.5"/>
<rect class="ln" x="156" y="182" width="90" height="7" rx="3.5" fill="#38BDF8"/>
<rect class="ln" style="animation-delay:.4s" x="170" y="198" width="110" height="7" rx="3.5" fill="#7DD3FC"/>
<rect class="ln" style="animation-delay:.8s" x="170" y="214" width="70" height="7" rx="3.5" fill="#F9A8D4"/>
<rect class="ln" style="animation-delay:1.2s" x="156" y="230" width="120" height="7" rx="3.5" fill="#60A5FA"/>
<rect class="cur" x="156" y="246" width="8" height="10" fill="#fff"/>
<rect x="120" y="265" width="220" height="10" rx="5" fill="#1E3A8A"/><rect x="205" y="265" width="50" height="4" rx="2" fill="#0B1736"/>
<ellipse class="paw" cx="203" cy="166" rx="14" ry="9" fill="#E0F2FE"/>
<ellipse class="paw" style="animation-delay:.3s" cx="257" cy="166" rx="14" ry="9" fill="#E0F2FE"/>
<g stroke="#93C5FD" stroke-width="1.2" stroke-linecap="round"><path d="M199 164v4M205 164v4M251 164v4M257 164v4"/></g>
<text class="hr" x="222" y="100" font-size="22" fill="#F9A8D4">♥</text>

<!-- floating code bits -->
<g font-weight="700" font-family="'Courier New',monospace">
<text class="f" x="70" y="130" font-size="24" fill="#38BDF8">&lt;/&gt;</text>
<text class="f" style="animation-delay:.8s" x="350" y="120" font-size="26" fill="#7DD3FC">{ }</text>
<text class="f" style="animation-delay:1.6s" x="360" y="225" font-size="30" fill="#60A5FA">;</text>
<text class="f" style="animation-delay:2.4s" x="75" y="225" font-size="22" fill="#F9A8D4">♥</text>
<text class="f" style="animation-delay:1.2s" x="105" y="70" font-size="20" fill="#E0F2FE">✦</text>
<text class="f" style="animation-delay:2s" x="330" y="60" font-size="18" fill="#7DD3FC">✦</text>
</g>

<!-- cycling words -->
<g font-size="64" font-weight="800">
<text class="w" x="440" y="160" fill="#7DD3FC">Learn.</text>
<text class="w" style="animation-delay:2s" x="440" y="160" fill="#38BDF8">Build.</text>
<text class="w" style="animation-delay:4s" x="440" y="160" fill="#93C5FD">Improve.</text>
</g>
<rect class="bar" x="442" y="182" width="260" height="5" rx="2.5" fill="#38BDF8"/>
<g fill="#38BDF8"><circle class="dot" cx="446" cy="214" r="5"/><circle class="dot" style="animation-delay:2s" cx="468" cy="214" r="5"/><circle class="dot" style="animation-delay:4s" cx="490" cy="214" r="5"/></g>
</g>
<rect x="8" y="8" width="784" height="284" rx="18" fill="none" stroke="#3B82F6" stroke-opacity=".8" stroke-width="2"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
